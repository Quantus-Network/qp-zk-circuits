---
name: Continuous Integration

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Principle of least privilege: all jobs only read the repo (checkout + cargo).
# Per-job override is unnecessary because no job pushes, creates releases or PRs.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_NET_TIMEOUT: 60
  NEXTEST_VERSION: 0.9.151

jobs:
  fast-checks:
    name: 🏁 Fast Checks (Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ubuntu
      - name: Install taplo
        run: cargo install taplo-cli --locked
      - name: Run format checks
        run: |
          taplo format --check --config taplo.toml
          cargo +nightly fmt --all -- --check

  test-workspace:
    name: 🧪 Test Workspace
    # needs: fast-checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Ubuntu
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/ubuntu
      - name: Setup macOS
        if: matrix.os == 'macos-latest'
        uses: ./.github/actions/macos
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      # Test selection lives in .config/nextest.toml and the -E filtersets.
      # Doctests are not supported by nextest and stay on `cargo test --doc`;
      # the GPU crate's compile_fail doctests only exist behind its features.
      - name: Test workspace (release, fast tests)
        run: |
          cargo nextest run --profile ci --workspace --locked --release --lib --bins -E 'not (test(aggregator_tests) | test(circuit_data_tests) | test(prover_tests) | test(verifier_tests))'
          cargo test --workspace --locked --release --doc
          cargo nextest run --profile ci --release --locked -p tests --test encoding_safety --test spec_differential
          cargo nextest run --profile ci --release --locked -p qp-wormhole-circuit --test heap_zeroization --test formal_trace
          cargo nextest run --profile ci --release --locked -p qp-wormhole-gpu --features constraint-export
          cargo test --release --locked -p qp-wormhole-gpu --features constraint-export --doc
          cargo nextest run --profile ci --release --locked -p qp-wormhole-aggregator --features gpu --lib -E 'test(gpu)'
          cargo nextest run --profile ci --release --locked -p qp-wormhole-aggregator --features gpu --example public_batch_compare

  analysis:
    name: 🤖 Analysis (Clippy & Doc)
    # needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ubuntu
      - name: Run clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check documentation
        run: cargo doc --workspace --locked --no-deps --all-features --document-private-items

  formal-spec:
    name: 📐 Formal Spec (Lean)
    # needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Builds the Lean 4 formal spec under `formal/`. The package is deliberately
      # mathlib-free and builds in seconds; `lake build` type-checks every proof in
      # the kernel, so a later edit that breaks a proof fails CI instead of rotting
      # silently. elan/lake are installed from `formal/lean-toolchain` (Lean v4.30).
      #
      # Defense-in-depth: `leanchecker` re-checks the compiled environment with an
      # independent kernel checker (bundled on v4.30). (We do *not* use `nanoda`,
      # the external Rust checker, which currently crashes on the v4.30 export
      # format; the no-`sorry` guarantee is enforced by the grep gate below, since
      # `leanchecker` accepts `sorryAx` as a valid axiom.)
      - name: Build formal spec (lake build)
        # Pinned to a full commit SHA (supply-chain hardening). 38fbc41 == v1.5.0.
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: "formal"
          use-mathlib-cache: "false"
          leanchecker: "true"
      # No-`sorry` gate: the spec must stay gap-free. Fail if any proof term uses a
      # `sorry`/`admit`/`sorryAx` placeholder. (Keep the literal words out of
      # comments/strings under `formal/` so this stays a clean signal.)
      - name: Assert the spec contains no sorry/admit
        run: |
          if grep -rEn '\b(sorry|admit|sorryAx)\b' --include='*.lean' formal; then
            echo "::error::formal spec contains a sorry/admit placeholder"
            exit 1
          fi

  formal-bridge:
    name: 🔗 Formal Bridge (qp-plonky2 shape tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # qp-plonky2 commit whose constraint-exporter readers describe the circuits on this
      # branch (Quantus-Network/qp-plonky2#116). Bump it together with any change to the
      # traced gadget-call order; the readers fail closed on a mismatch.
      QP_PLONKY2_REF: 825efba73a324f4e5add671d6668095e0dfe9308
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ubuntu
      # The Lean bridge in qp-plonky2 proves soundness of the *traced* gadget calls, so a
      # circuit edit that drops a constraint (e.g. a range check) only shows up when the
      # exporter's shape readers are run against the new trace. Trace from the circuits in
      # this checkout rather than trusting the committed JSON, then run the readers.
      - name: Record gadget-call traces from this checkout
        run: |
          UPDATE_FORMAL_TRACE=1 cargo test --release --locked -p qp-wormhole-circuit --test formal_trace
          UPDATE_FORMAL_TRACE=1 cargo test --release --locked -p qp-wormhole-aggregator --lib -- trace_is_current
      - name: Check out qp-plonky2 constraint exporter
        uses: actions/checkout@v4
        with:
          repository: Quantus-Network/qp-plonky2
          ref: ${{ env.QP_PLONKY2_REF }}
          path: qp-plonky2
      - name: Run the exporter shape readers against the fresh traces
        working-directory: qp-plonky2
        env:
          WORMHOLE_TRACES: ${{ github.workspace }}/formal/traces
        run: |
          rustup toolchain install
          cargo test --release -p qp-plonky2-constraint-exporter \
            --test leaf_circuit --test private_batch_wrapper --test public_batch_wrapper

  slow-tests:
    name: 🐌 Slow Tests (Crypto-heavy)
    # needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ubuntu
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Build circuit binaries
        run: ./scripts/build-circuits.sh
      # The `tests` crate generates its circuit artifacts once per test process
      # (std::sync::Once); under nextest's process-per-test model every test
      # would regenerate them, so this invocation stays on `cargo test`.
      - name: Run slow crypto tests
        run: |
          cargo test --release -p tests -- aggregator_tests circuit_data_tests prover_tests verifier_tests
          cargo nextest run --profile ci --release --package qp-wormhole-aggregator
          cargo test --release --package qp-wormhole-aggregator --doc
      # The 2^19 production public-batch builds peak at ~12 GB each, more than
      # the 7 GB macos-latest runner has, so they are #[ignore]d in
      # test-workspace. The `production-circuit` test group in
      # .config/nextest.toml runs them one at a time.
      - name: Run production-shape degree guards
        run: |
          cargo nextest run --profile ci --release --locked -p qp-wormhole-aggregator --lib --run-ignored only -E 'test(production_public_batch_stays_at_degree_19) | test(generator_builds_production_public_batch_artifacts)'

  security-audit:
    name: 🔐 Security Audit
    needs: fast-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Cache cargo-audit binary
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin-${{ runner.os }}-0.22.1
      - name: Cache RustSec advisory database
        uses: actions/cache@v5
        with:
          path: ~/.cargo/advisory-db
          key: cargo-advisory-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            cargo-advisory-db-${{ runner.os }}-
      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked --version 0.22.1
          fi
      - name: Run cargo audit
        run: cargo audit
