[package]
authors.workspace = true
description = "GPU execution support for Wormhole proving"
edition.workspace = true
license.workspace = true
name = "qp-wormhole-gpu"
repository.workspace = true
version.workspace = true

[features]
default = []
wgpu = [
	"dep:anyhow",
	"dep:qp-plonky2",
	"dep:wgpu",
]

[dependencies]
anyhow = { workspace = true, optional = true, features = ["std"] }
qp-plonky2 = { workspace = true, optional = true }
wgpu = { version = "=27.0.1", optional = true, default-features = false, features = [
	"metal",
	"std",
	"vulkan",
	"wgsl",
] }

[dev-dependencies]
futures = { version = "=0.3.32", default-features = false, features = ["executor"] }

[lints]
workspace = true
