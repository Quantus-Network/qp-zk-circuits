[package]
authors.workspace = true
description.workspace = true
edition.workspace = true
license.workspace = true
name = "qp-zk-circuits-common"
readme = "README.md"
version.workspace = true

[dependencies]
anyhow = { workspace = true, default-features = false }
qp-plonky2 = { workspace = true, default-features = false }
qp-poseidon-core = { workspace = true, default-features = false }
qp-wormhole-inputs = { version = "=4.4.0", path = "../wormhole/inputs", default-features = false }
serde = { workspace = true }
serde_json = { version = "=1.0.150", default-features = false, features = ["alloc"] }

[features]
default = ["std"]
formal-export = ["qp-plonky2/formal-export", "std"]
std = [
	"anyhow/std",
	"qp-plonky2/std",
	"qp-poseidon-core/std",
	"qp-wormhole-inputs/std",
	"serde/std",
	"serde_json/std",
]
